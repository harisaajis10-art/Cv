<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Haris Abdul Ajis — CV</title>
<meta name="description" content="CV Haris Abdul Ajis, siswa TKJ SMKN 1 Rancaekek.">
<meta name="theme-color" content="#2f6f5e">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%232f6f5e'/%3E%3Ctext x='32' y='43' font-size='30' text-anchor='middle' fill='white' font-family='Georgia,serif'%3EH%3C/text%3E%3C/svg%3E">
<style>
:root{
  --bg:#f7f5f0; --surface:#ffffff; --surface-2:#efece5; --ink:#1d2421; --muted:#5f6b66;
  --line:#dedad0; --accent:#2f6f5e; --accent-ink:#ffffff; --accent-soft:#dcebe5;
  --shadow:0 1px 2px rgba(20,30,25,.05),0 8px 24px rgba(20,30,25,.06);
  --radius:14px; --maxw:1080px;
  --serif:Georgia,"Times New Roman",serif;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
:root[data-theme="dark"]{
  --bg:#121715; --surface:#1a211e; --surface-2:#222b27; --ink:#e9eeeb; --muted:#9aa8a1;
  --line:#2c3732; --accent:#6fbfa5; --accent-ink:#0f1a16; --accent-soft:#1f322b;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 28px rgba(0,0,0,.28);
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;scroll-padding-top:76px}
body{font-family:var(--sans);background:var(--bg);color:var(--ink);line-height:1.65;font-size:16px;
  transition:background .3s,color .3s;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
img{max-width:100%;display:block}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
.wrap{max-width:var(--maxw);margin:0 auto;padding:0 22px}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:6px}

/* progress */
#progress{position:fixed;top:0;left:0;height:3px;width:0;background:var(--accent);z-index:100;transition:width .1s}

/* header */
header.top{position:sticky;top:0;z-index:50;background:color-mix(in srgb,var(--bg) 88%,transparent);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid transparent;transition:border-color .3s}
header.top.scrolled{border-bottom-color:var(--line)}
.nav{display:flex;align-items:center;justify-content:space-between;height:64px;gap:16px}
.brand{font-family:var(--serif);font-size:1.15rem;font-weight:700;letter-spacing:.2px}
.brand span{color:var(--accent)}
.menu{display:flex;gap:4px;align-items:center}
.menu a{padding:7px 12px;border-radius:999px;font-size:.92rem;color:var(--muted);transition:.2s}
.menu a:hover{color:var(--ink);background:var(--surface-2)}
.menu a.active{color:var(--accent);background:var(--accent-soft)}
